name: Deploy Panel 5 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish a stable stylesheet path
        run: |
          css_file=$(find dist/assets -maxdepth 1 -type f -name '*.css' | head -n 1)
          test -n "$css_file"
          cp "$css_file" dist/assets/panel5.css
          sed -i -E 's#assets/index-[^"]+\.css#assets/panel5.css#g' dist/index.html
          sed -i -E "s#(assets/index-[^"]+\.js)#\1?v=${GITHUB_SHA}#g" dist/index.html
          sed -i "s#assets/panel5.css#assets/panel5.css?v=${GITHUB_SHA}#g" dist/index.html
      - name: Add SPA fallback for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/ftu
          cp dist/index.html dist/ftu/index.html
          sed -i 's#\./assets/#../assets/#g' dist/ftu/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
